name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install engine
        run: pip install -e ./engine

      - name: Install test deps
        # The auth/API/tracking tests import the web + auth stack at collection
        # time. bcrypt in particular is a hard dependency of engine.auth
        # (imported eagerly from its __init__), so without it pytest errors out
        # during collection rather than running the suite. These are all pure
        # wheels (no system libs) and mirror the runtime image's deps.
        run: pip install pytest responses fastapi httpx python-multipart bcrypt cryptography

      - name: Run tests
        run: pytest tests/ -v
        env:
          # Tests run against mocked HTTP — no real API keys needed.
          # Set this in repo secrets if you want integration tests to hit live APIs.
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
