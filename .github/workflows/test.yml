name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned to match the ruff in flake.nix (nix develop) so the lint
      # result is identical locally and in CI. Bump both together.
      - name: Run ruff
        run: |
          pip install ruff==0.15.13
          ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install engine
        run: pip install -e ./engine

      - name: Install test deps
        # The API/tracking/healthkit tests import the web stack at collection
        # time. These are all pure wheels (no system libs) and mirror the runtime
        # image's deps. psycopg2-binary is required since the Postgres migration:
        # db/pool.py imports psycopg2 at module load and tests/conftest.py pulls
        # it in, so without it pytest errors during collection. pysam lets the
        # VCF-parser tests (incl. the decompression-bomb variant-cap guard) run
        # rather than skip.
        run: pip install pytest responses fastapi httpx python-multipart cryptography psycopg2-binary pysam

      - name: Run tests
        run: pytest tests/ -v
        env:
          # Tests run against mocked HTTP — no real API keys needed.
          # Set this in repo secrets if you want integration tests to hit live APIs.
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}

      - name: Tier A analytical-validation gates
        # The build-handling and STR runners exit non-zero on a control
        # failure (e.g. a non-GRCh38 coordinate file allowed to proceed —
        # hazard H-01 — or an EH-parser/interpretation regression). Running
        # them here turns those controls into hard CI gates, in addition to
        # the offline unit tests above. Both need no external data or network.
        run: |
          python -m validation.tier_a.build_handling --out-dir validation/reports
          python -m validation.tier_a.str_calling     --out-dir validation/reports

      - name: Upload Tier A validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier-a-validation-reports-py${{ matrix.python-version }}
          path: validation/reports/
          if-no-files-found: ignore
