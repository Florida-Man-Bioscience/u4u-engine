name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to match the ruff in flake.nix (nix develop) so the lint
      # result is identical locally and in CI. Bump both together.
      - name: Run ruff
        run: |
          pip install ruff==0.15.13
          ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install engine
        run: pip install -e ./engine

      - name: Install test deps
        # The auth/API/tracking/healthkit tests import the web + auth stack at
        # collection time. bcrypt is a hard dependency of engine.auth (imported
        # eagerly), and pyjwt[crypto]+cryptography back OIDC access-token
        # validation. These are all pure wheels (no system libs) mirroring the
        # runtime image's deps. psycopg2-binary is required since db/pool.py
        # imports psycopg2 at module load and tests/conftest.py pulls it in, so
        # without it pytest errors during collection. pysam lets the VCF-parser
        # tests (incl. the decompression-bomb variant-cap guard) run rather than skip.
        run: pip install pytest responses fastapi httpx python-multipart bcrypt pyjwt[crypto] cryptography psycopg2-binary pysam

      - name: Run tests
        run: pytest tests/ -v
        env:
          # Tests run against mocked HTTP — no real API keys needed.
          # Set this in repo secrets if you want integration tests to hit live APIs.
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}

      - name: Tier A analytical-validation gates
        # The build-handling and STR runners exit non-zero on a control
        # failure (e.g. a non-GRCh38 coordinate file allowed to proceed —
        # hazard H-01 — or an EH-parser/interpretation regression). Running
        # them here turns those controls into hard CI gates, in addition to
        # the offline unit tests above. Both need no external data or network.
        run: |
          python -m validation.tier_a.build_handling --out-dir validation/reports
          python -m validation.tier_a.str_calling     --out-dir validation/reports

      - name: Upload Tier A validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier-a-validation-reports-py${{ matrix.python-version }}
          path: validation/reports/
          if-no-files-found: ignore

  # The default `test` job runs entirely on SQLite. Production is Postgres,
  # which uses the incremental db/migrations/*.sql chain instead of the
  # self-healing engine/tracking/schema.sql — so SQL-dialect drift and
  # unapplied migrations are invisible to that job and only surface as HTTP
  # 500s in prod. This job boots an ephemeral Postgres (the smoke suite does
  # this itself via initdb + pg_ctl), applies the full migration chain, and
  # exercises the real write/read paths against it.
  postgres-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Put Postgres server binaries on PATH
        # ubuntu-latest ships PostgreSQL preinstalled, but initdb/pg_ctl live
        # in a versioned libexec dir that isn't on PATH. The smoke harness
        # boots its own trust-auth, unix-socket-only cluster as the runner
        # user, so no system postgres service is needed — only the binaries.
        run: |
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$PG_BIN" ]; then
            sudo apt-get update && sudo apt-get install -y postgresql
            PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          fi
          echo "$PG_BIN" >> "$GITHUB_PATH"

      - name: Install engine
        run: pip install -e ./engine

      - name: Install test deps
        # pyjwt[crypto] is needed here too: the smoke suite imports `api`, which
        # pulls in engine.users.deps -> token_validator -> jwt at collection time.
        run: pip install pytest responses fastapi httpx python-multipart bcrypt pyjwt[crypto] cryptography psycopg2-binary

      - name: Run Postgres smoke tests
        run: PG_TESTS=1 pytest tests/test_postgres_smoke.py -v

  # CI installs deps with pip lists that are INDEPENDENT of the runtime
  # Dockerfile, so a package can be present in every test job and still be
  # missing from the shipped image. That gap shipped a production outage: the
  # image lacked pyjwt, `api.py` -> engine.users.deps -> token_validator did a
  # module-level `import jwt`, and the pod crash-looped on startup while CI was
  # fully green. Build the real image and prove the app imports inside it.
  docker-import-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build runtime image
        run: docker build -t u4u-engine:ci .

      - name: App must import inside the runtime image
        # Catches ModuleNotFoundError for anything pulled in at app-import time
        # — the exact failure mode that crash-loops the pod in production.
        run: docker run --rm u4u-engine:ci python -c "import api; print('app import OK')"
