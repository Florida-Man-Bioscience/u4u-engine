name: build and push di-lab

on:
  push:
    branches: [main]
    paths:
      - lab/**
      - .github/workflows/build-and-push-di-lab.yml

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: zot.hwcopeland.net
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_API_KEY }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: zot.hwcopeland.net/florida-man-bioscience/di-lab
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: ./lab
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
