# docker-compose.yml — local development and testing
# Usage:
#   cp .env.example .env        # fill in NCBI_API_KEY
#   docker compose up --build
#   curl http://localhost:8000/health
#   curl -X POST http://localhost:8000/analyze -F "file=@your_file.vcf"

services:
  api:
    build:
      context: .
      network: host
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Populate the biomarker tracking DB with synthetic demo data on first
      # start. Idempotent: skipped on restart if patients already exist.
      # Unset (or remove this line) to keep tracking empty in production.
      SEED_DEMO_DATA: "1"
    volumes:
      # Mount data/ so you can update filter files without rebuilding the image.
      # Remove this volume mount in production — bake data/ into the image instead.
      - ./data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        # In prod (behind the Caddy proxy at app.flmanbiosci.net) set
        # NEXT_PUBLIC_API_BASE=/api/v1 in .env so the browser calls the
        # same-origin /api/* path. Locally, keep it pointed at the api
        # container's host port so direct :3000 access still works.
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://localhost:8000}"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
  website:
    # Marketing site (flmanbiosci.net) — lives in a separate repo at
    # ../fmb-website. Clone it as a sibling of u4u-engine/ before running
    # compose. Static site (nginx), no env, no deps on the API.
    build:
      context: ../fmb-website
    ports:
      - "8080:80"
    restart: unless-stopped
  proxy:
    # Caddy reverse proxy in front of the whole stack.
    #   http://localhost/           → website (marketing)
    #   http://localhost/tracking   → frontend (Next.js)
    #   http://localhost/api/...    → api (FastAPI)
    # The individual services' host port mappings above are kept so you
    # can still hit each one directly during debugging.
    #
    # For production set SITE_ADDRESS in .env (e.g.
    #   SITE_ADDRESS=flmanbiosci.net, www.flmanbiosci.net
    # ) and Caddy will auto-provision Let's Encrypt certs on port 443.
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "81:81"        # tracking app in dev mode (use APP_ADDRESS for prod)
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      MARKETING_ADDRESS: "${MARKETING_ADDRESS:-:80}"
      APP_ADDRESS:       "${APP_ADDRESS:-:81}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
      - website
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
