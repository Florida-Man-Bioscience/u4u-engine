# docker-compose.yml — local development and testing
# Usage:
#   cp .env.example .env        # fill in NCBI_API_KEY
#   docker compose up --build
#   curl http://localhost:8000/health
#   curl -X POST http://localhost:8000/analyze -F "file=@your_file.vcf"
#
# This file does NOT include a reverse proxy. The production deploy is
# expected to run its own TLS-terminating proxy (Caddy, nginx, Cloudflare
# Tunnel, etc.) in front of these containers — it must route
# /api/v1/* (prefix-stripped) to api:8000 and everything else to
# frontend:3000.

services:
  api:
    build:
      context: .
      network: host
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Populate the biomarker tracking DB with synthetic demo data on first
      # start. Idempotent: skipped on restart if patients already exist.
      # Unset (or remove this line) to keep tracking empty in production.
      SEED_DEMO_DATA: "1"
      # Point the engine at the local Postgres service below. The engine
      # auto-migrates on startup (db/migrate.py) and falls back to SQLite
      # when DATABASE_URL is unset — so removing `postgres` from this compose
      # file reverts to the previous file-backed behavior with no code change.
      DATABASE_URL: "${DATABASE_URL:-postgresql://u4u:u4u_dev_password@postgres:5432/u4u?sslmode=disable}"
    volumes:
      # Mount data/ so you can update filter files without rebuilding the image.
      # Remove this volume mount in production — bake data/ into the image instead.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Local development Postgres. Mirrors the production StatefulSet
  # (postgres:16-alpine, db/user `u4u`) defined in the iac repo at
  # rke2/tooling/flux/theswamp/postgres.yaml, so DATABASE_URL-dependent code
  # exercises the same engine locally. NOT for production — production runs
  # the in-cluster StatefulSet with a Bitwarden-sourced password.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: u4u
      POSTGRES_USER: u4u
      # Dev-only password. The production password comes from the
      # u4u-postgres-secret ExternalSecret (Bitwarden), never hard-coded.
      POSTGRES_PASSWORD: u4u_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Exposed on the host so you can psql in / point a native iOS-sim build
      # at localhost:5432 during development.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U u4u -d u4u"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        # The app is served behind an external reverse proxy that routes
        # /api/v1/* to the api container on the SAME origin as the
        # frontend, so the browser bundle must call the relative
        # "/api/v1" path. Baking in http://localhost:8000 here would
        # make the visitor's browser try to reach port 8000 on THEIR
        # OWN machine (and trip CORS), surfacing as "Load failed" on
        # every request.
        #
        # When hitting the frontend directly on :3000 in local dev
        # (bypassing any proxy), set NEXT_PUBLIC_API_BASE=http://localhost:8000
        # in .env to point the bundle at the api container's host port.
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-/api/v1}"
    environment:
      # Server-side base URL used by Next SSR to prefetch the curated
      # regulatory baseline (paired with NEXT_PUBLIC_API_BASE above —
      # NEXT_PUBLIC_* is for the browser bundle and is usually relative,
      # which the Next server cannot fetch).
      INTERNAL_API_BASE: "${INTERNAL_API_BASE:-http://api:8000}"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  # Persists the dev Postgres data across `docker compose down`/`up`.
  # `docker compose down -v` wipes it for a clean slate.
  pgdata:
