# docker-compose.yml — local development and testing
# Usage:
#   cp .env.example .env        # fill in NCBI_API_KEY
#   docker compose up --build
#   curl http://localhost:8000/health
#   curl -X POST http://localhost:8000/analyze -F "file=@your_file.vcf"

services:
  api:
    build:
      context: .
      network: host
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Populate the biomarker tracking DB with synthetic demo data on first
      # start. Idempotent: skipped on restart if patients already exist.
      # Unset (or remove this line) to keep tracking empty in production.
      SEED_DEMO_DATA: "1"
      # Auth runs OPEN by default so the engine deploys as a self-contained
      # demo with a plain `docker compose up --build` (the frontend image
      # also ships with its auth UI disabled — see NEXT_PUBLIC_AUTH_DISABLED
      # below). Genome/results endpoints are unauthenticated in this mode —
      # safe for local/dev/demo, NOT for a public PHI deployment.
      # To enable real auth, set in .env:
      #   ALLOW_INSECURE_NO_AUTH=0
      #   NEXT_PUBLIC_AUTH_DISABLED=0
      #   AUTH_BOOTSTRAP_USERNAME=... AUTH_BOOTSTRAP_PASSWORD=...   (or API_KEYS=...)
      ALLOW_INSECURE_NO_AUTH: "${ALLOW_INSECURE_NO_AUTH:-1}"
    volumes:
      # Mount data/ so you can update filter files without rebuilding the image.
      # Remove this volume mount in production — bake data/ into the image instead.
      - ./data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        # In prod (behind the Caddy proxy at flmanbiosci.net) set
        # NEXT_PUBLIC_API_BASE=/api/v1 in .env so the browser calls the
        # same-origin /api/* path. Locally, keep it pointed at the api
        # container's host port so direct :3000 access still works.
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://localhost:8000}"
        # Keep the browser auth UI disabled by default to match the API's
        # open-demo mode (ALLOW_INSECURE_NO_AUTH above). Set to "0" in .env
        # — together with the backend auth vars — to turn on the login flow.
        NEXT_PUBLIC_AUTH_DISABLED: "${NEXT_PUBLIC_AUTH_DISABLED:-1}"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
  website:
    # Marketing site (flmanbiosci.net) — lives in a SEPARATE repo at
    # ../fmb-website and is NOT part of the PeptOdyssey engine deployment.
    # It is gated behind the "marketing" compose profile so the engine
    # stack (api + frontend + proxy) builds and starts on its own with a
    # plain `docker compose up --build`, without requiring the sibling
    # repo to be cloned. To run the marketing site too, clone
    # ../fmb-website and start with:
    #     docker compose --profile marketing up --build
    profiles: ["marketing"]
    build:
      context: ../fmb-website
    ports:
      - "8080:80"
    restart: unless-stopped
  proxy:
    # Caddy reverse proxy in front of the engine stack.
    #   http://localhost/            → frontend (Next.js)
    #   http://localhost/api/v1/...  → api (FastAPI)
    # The individual services' host port mappings above are kept so you
    # can still hit each one directly during debugging.
    #
    # For production set SITE_ADDRESS in .env (e.g.
    #   SITE_ADDRESS=flmanbiosci.net, www.flmanbiosci.net
    # ) and Caddy will auto-provision Let's Encrypt certs on port 443.
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
