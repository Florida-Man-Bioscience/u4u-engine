# docker-compose.yml — local development and testing
# Usage:
#   cp .env.example .env        # fill in NCBI_API_KEY
#   docker compose up --build
#   curl http://localhost:8000/health
#   curl -X POST http://localhost:8000/analyze -F "file=@your_file.vcf"
#
# This file does NOT include a reverse proxy. The production deploy is
# expected to run its own TLS-terminating proxy (Caddy, nginx, Cloudflare
# Tunnel, etc.) in front of these containers — it must route
# /api/v1/* (prefix-stripped) to api:8000 and everything else to
# frontend:3000.

services:
  api:
    build:
      context: .
      network: host
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Populate the biomarker tracking DB with synthetic demo data on first
      # start. Idempotent: skipped on restart if patients already exist.
      # Unset (or remove this line) to keep tracking empty in production.
      SEED_DEMO_DATA: "1"
    volumes:
      # Mount data/ so you can update filter files without rebuilding the image.
      # Remove this volume mount in production — bake data/ into the image instead.
      - ./data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        # The app is served behind an external reverse proxy that routes
        # /api/v1/* to the api container on the SAME origin as the
        # frontend, so the browser bundle must call the relative
        # "/api/v1" path. Baking in http://localhost:8000 here would
        # make the visitor's browser try to reach port 8000 on THEIR
        # OWN machine (and trip CORS), surfacing as "Load failed" on
        # every request.
        #
        # When hitting the frontend directly on :3000 in local dev
        # (bypassing any proxy), set NEXT_PUBLIC_API_BASE=http://localhost:8000
        # in .env to point the bundle at the api container's host port.
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-/api/v1}"
    environment:
      # Server-side base URL used by Next SSR to prefetch the curated
      # regulatory baseline (paired with NEXT_PUBLIC_API_BASE above —
      # NEXT_PUBLIC_* is for the browser bundle and is usually relative,
      # which the Next server cannot fetch).
      INTERNAL_API_BASE: "${INTERNAL_API_BASE:-http://api:8000}"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
