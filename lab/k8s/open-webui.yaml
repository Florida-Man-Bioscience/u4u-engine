# Open WebUI behind https://flmanbiosci.net/owui (no new DNS).
# nginx on :8080 rewrites /owui/ → Open WebUI on :8081.
# Jail token stays in secret di-lab-keys — never in this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-chat-nginx
  namespace: theswamp
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      server {
        listen 8080;
        server_name _;
        location = /owui { return 301 /owui/; }
        location /owui/ {
          proxy_pass http://127.0.0.1:8081/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Prefix /owui;
          proxy_set_header Accept-Encoding "";
          proxy_read_timeout 600s;
          sub_filter_types text/html application/javascript text/javascript text/css;
          sub_filter 'href="/' 'href="/owui/';
          sub_filter 'src="/' 'src="/owui/';
          sub_filter 'action="/' 'action="/owui/';
          sub_filter '"/_app' '"/owui/_app';
          sub_filter "'/_app" "'/owui/_app";
          sub_filter 'const _="Open WebUI",a=""' 'const _="Open WebUI",a="/owui"';
          sub_filter 'base: ""' 'base: "/owui"';
          sub_filter '/static/splash' '/owui/static/splash';
          sub_filter_once off;
        }
        location = /health {
          proxy_pass http://127.0.0.1:8081/health;
        }
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab-chat-data
  namespace: theswamp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lab-chat
  namespace: theswamp
spec:
  selector:
    app: lab-chat
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-chat
  namespace: theswamp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lab-chat
  template:
    metadata:
      labels:
        app: lab-chat
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.6.36
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: WEBUI_NAME
              value: Discovery Informatics
            - name: WEBUI_URL
              value: https://flmanbiosci.net/owui
            - name: WEBUI_AUTH
              value: "false"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: CORS_ALLOW_ORIGIN
              value: "https://flmanbiosci.net"
            - name: OPENAI_API_BASE_URL
              value: http://di-lab:8080/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: di-lab-keys
                  key: LAB_SHARED_TOKEN
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 50
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
        - name: prefix
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lab-chat-data
        - name: nginx
          configMap:
            name: lab-chat-nginx

